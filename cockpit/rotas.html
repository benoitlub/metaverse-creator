<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Place de Rotas · Blacklace Island</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#102520;color:#faeac9;font:16px system-ui,sans-serif}
main{height:100dvh;min-height:480px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
