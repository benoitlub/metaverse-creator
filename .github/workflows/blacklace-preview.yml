name: Publish Blacklace preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blacklace-preview.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4aba459549acc8baa6c7a611a90fe4f8e1ecce6f
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: cockpit
      - run: npm run build -- --base=./
        working-directory: cockpit
        env:
          VITE_BLACKLACE_PREVIEW: "true"
          VITE_WORKER_URL: https://blacklace-publisher-worker.benoitlubert.workers.dev/api/metaverse
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cockpit/dist
      - uses: actions/deploy-pages@v4
        id: deployment
